version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: operador_postgres
    environment:
      POSTGRES_USER: operador
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: operador_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operador"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - operador_network

  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: operador_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: operador
      RABBITMQ_DEFAULT_PASS: password123
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - operador_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: operador_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - operador_network

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:

networks:
  operador_network:
    driver: bridge
