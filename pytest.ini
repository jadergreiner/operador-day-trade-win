[pytest]
# Configuração pytest para Sprint 2
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --verbose
    --strict-markers
    --tb=short
    --disable-warnings
    -p no:warnings

markers =
    unit: Teste unitário (sem dependências externas)
    integration: Teste de integração (usa banco de dados, fila, etc)
    slow: Testes lentos
    critical: Testes críticos do GATE
    orders: Testes da execução de ordens
    risk: Testes do validador de risco
    smoke: Teste smoke (verificação básica)
    documentation: Testes de validação de documentação
    ml: Testes de machine learning

# Coverage
[coverage:run]
source = src
omit =
    */tests/*
    */site-packages/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abstract.abstractproperty

[coverage:html]
directory = htmlcov
