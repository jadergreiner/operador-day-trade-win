# Configuração do AlertDispatcher
# Arquivo: config/alert_dispatcher.yaml

# Dispatcher Configuration (Task #4)
dispatcher:
  # WebSocket com fallback para email (AC-3, AC-4)
  websocket:
    timeout_seconds: 30  # Se exceder, dispara email
    broadcast_enabled: true
    max_concurrent_connections: 100
  
  # Email fallback automático
  email_fallback:
    enabled: true
    use_retry: true
    max_retries: 3
    retry_delay_base: 5  # segundos
  
  # Histórico de alertas
  history:
    max_size: 1000  # Manter últimos 1000 alertas
    persist_to_db: true
    cleanup_older_than_days: 30
  
  # Logging (AC-5)
  logging:
    level: "INFO"
    file: "data/logs/alert_dispatcher.log"
    max_file_size_mb: 100
    max_backups: 10


# Templates de Email (AC-4)
templates:
  # Alerta de oportunidade (trade alert)
  trade_alert:
    enabled: true
    subject_pattern: "⚡ ALERTA: {symbol} {operation} | Score: {confidence_score:.0%}"
    template: "templates/alerts/trade_alert.html"
  
  # Alerta de risco (circuit breakers)
  risk_alert:
    enabled: true
    subject_pattern: "⚠️  RISCO: {reason}"
    template: "templates/alerts/risk_alert.html"
  
  # Relatório diário
  daily_report:
    enabled: true
    subject_pattern: "📊 Operador - Relatório {date}"
    template: "templates/alerts/daily_report.html"


# Mock/Test Configuration (AC-6)
test_config:
  enabled: false
  mock_websocket: false
  mock_email: false
  capture_alerts: true
